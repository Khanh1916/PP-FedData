# Published results on the DoS/DDoS-MQTT-IoT dataset (section 9.13 of the report, `compare-published`).
# Typed by hand from the papers: every value says what the paper states, and where it was read. A study enters `included` only if it
# trains or tests on this dataset and its full text was read at the source, so that its task, input, split and metric come from the paper.
snapshot:
  date: "2026-11-09"
  index: "OpenAlex, works citing doi:10.1016/j.comnet.2023.109809"
  citing: 103
  no_abstract: 21
  mqtt_and_detection: 36

included:
  - key: alatram2023
    name: "Alatram et al. 2023"
    role: "the dataset's own authors, the reference every later paper starts from"
    citation: "Alatram, Sikos, Johnstone, Szewczyk, Kang. Computer Networks 231:109809, 2023"
    url: "https://doi.org/10.1016/j.comnet.2023.109809"
    read: "full text, published version (CC BY, figshare copy)"
    task: "attack / normal (labels 1 / 0, assigned from the source IP); Table 10 is captioned for the Sub_DDoS set"
    input: "packets; the 30-feature list (Table 6) has ip.src, tcp.stream, frame.time_epoch, frame.time_relative; the paper does not say which columns the classifiers received"
    split: "not described; 3,654,560 records used (2.3 %)"
    result: "accuracy, Random Forest 92.69 to 100.00 %, XGBoost 92.72 to 100.00 % over the five unlabelled blocks of Table 10; no F1"
  - key: zhang2026
    name: "Zhang et al. 2026"
    role: "the highest F1 read, obtained from a different input (packet payload)"
    citation: "Zhang, Cui, Cui, Huang, Li, Shi, Lan. Cybersecurity 9:65, 2026"
    url: "https://doi.org/10.1186/s42400-025-00495-x"
    read: "full text (open access), Tables 4, 5, 6"
    task: "binary, each attack against benign; DDoS variants of BF, Delay, Sub, WILL only; SYN excluded because it has no payload"
    input: "packet payload: keywords of 7-14 bytes found in windows of 30 packets grouped by IP addresses and protocol, hashed (MD5) to 8 integers"
    split: "a contiguous part of the captures, balanced by selection (Table 4); the train / test ratio is not stated"
    result: "F1 (RF): BF 1.0000, Delay 1.0000, Sub 0.9928, WILL 0.9988 (Table 5); 99.88 % in Table 6"
  - key: parra2026
    name: "Parra & Bayas 2026"
    role: "the setup closest to this study: no payload and a statistical view of the traffic"
    citation: "Parra, Bayas. Technologies 14(5):253, 2026"
    url: "https://doi.org/10.3390/technologies14050253"
    read: "full text (open access), Tables 3, 4"
    task: "binary, normal against flooding_basic and flooding_delayed"
    input: "TCP flows in windows of 1 s; 4 statistics: inter-arrival time, packet rate, byte rate, frame length"
    split: "stratified 70 / 30 and stratified 5-fold; no separation by capture stated; at most 300,000 records per category"
    result: "F1 0.846, accuracy 0.802, AUC 0.876 (hold-out, Table 3); 5-fold F1 0.842, Random Forest 0.839 (Table 4)"

