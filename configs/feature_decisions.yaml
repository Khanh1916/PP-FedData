  reason: qos level 2
  multi: false
  category_mismatch:
    normal_only: {}
    attack_only:
      '2': 25414
  value_map:
    At most once delivery (Fire and Forget): '0'
    At least once delivery (Acknowledged deliver): '1'
    Exactly once delivery (Assured Delivery): '2'
    Reserved: '3'
  format_note: Normal uses numeric codes, Attack uses text; parser maps text to code.
requested_qos:
  action: categorical
  reason: requested qos
  multi: false
  note: 'Spec auto-drop rule (empty >99.9% in every class) does not hold: max presence
    0.166'
  genuine_absence: Empty in Normal because Normal rarely/never triggers the parent
    event (Normal has 40 packets with message_type=8); not treated as an extraction
    artifact.
  multi_artifact: 'multi-value cells: Normal 0.0000% vs Attack 0.3601%. The Normal
    export keeps the first occurrence only, so counts/sums over multi-value cells
    are not comparable.'
  multi_policy: first_only
  category_mismatch:
    normal_only:
      '0': 3
      '2': 3
    attack_only: {}
  value_map:
    At most once delivery (Fire and Forget): '0'
    At least once delivery (Acknowledged deliver): '1'
    Exactly once delivery (Assured Delivery): '2'
    Reserved: '3'
  format_note: Normal uses numeric codes, Attack uses text; parser maps text to code.
frame_length_on_wire_1:
  action: drop
  reason: 'Duplicate of frame_length_on_wire_2: equal in 14044724/14044724 Attack
    rows where both are present, never present without it; empty in Normal.'
  duplicate_of: frame_length_on_wire_2
clean_session_flag_1:
  action: drop
  reason: 'Duplicate of clean_session_flag_2: equal in 2028233/2028233 Attack rows
    where both are present, never present without it; empty in Normal.'
  duplicate_of: clean_session_flag_2
n_mqtt_msgs:
  action: drop
  suspect: false
  derived_from: message_type
  reason: 'Number of MQTT messages per packet (spec: first+count).'
  suspect_reasons_resolved:
  - Multi-value cells exist only in Attack, so the count is <= 1 in Normal by construction.
  g1_decision: Drop. Multi-value cells exist only in Attack (Normal export used occurrence=f);
    policy for message_type etc. is first_only.
_row_filters:
  normal_only:
    protocol:
    - TCP
    - MQTT
  note: Applied in Phase 3 sampling to Normal rows only.
_g1:
  approved_on: '2026-10-03'
  decisions:
  - 'will_message_length, will_topic_length: keep (genuine protocol semantics; Normal
    exports will_flag for all CONNECT packets and never sets it).'
  - 'protocol: keep and filter Normal rows to {TCP, MQTT} in Phase 3.'
  - 'multi-value cells: first_only; drop n_mqtt_msgs.'
  - 'time_since_first_frame_in_this_tcp_stream: diagnostic only, decide at G2.'
  - 'requested_qos: keep (INVALID-class behaviour; Normal has almost no SUBSCRIBE).'
