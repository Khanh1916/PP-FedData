protocol:
  action: categorical
  reason: protocol
  multi: false
  category_mismatch:
    normal_only:
      ARP: 73
      CDP: 5642
      DHCPv6: 44
      DNS: 80
      ICMP: 80
      ICMPv6: 22
      IGMPv3: 16
      LLDP: 362
      LLMNR: 54
      LOOP: 33855
      MDNS: 88
      NBNS: 120
      SSDP: 7546
      STP: 168958
    attack_only: {}
  suspect: false
  suspect_reasons_resolved:
  - '0.476% of Normal tokens have values never seen in Attack: {''ARP'': 73, ''CDP'':
    5642, ''DHCPv6'': 44, ''DNS'': 80, ''ICMP'': 80, ''ICMPv6'': 22, ''IGMPv3'': 16,
    ''LLDP'': 362, ''LLMNR'': 54, ''LOOP'': 33855, ''MDNS'': 88, ''NBNS'': 120, ''SSDP'':
    7546, ''STP'': 168958}.'
  g1_decision: Keep. Normal rows are filtered to row_filters.protocol in Phase 3 (STP/LOOP/SSDP/...
    occur in every Normal capture, never in Attack).
message_type:
  action: categorical
  reason: message type
  multi: true
  multi_artifact: 'multi-value cells: Normal 0.0000% vs Attack 1.5769%. The Normal
    export keeps the first occurrence only, so counts/sums over multi-value cells
    are not comparable.'
  multi_policy: first_only
  unmapped_tokens:
    count: 27
    share: 1.19e-06
    examples:
    - Reserved
    - Publish Re
    - Publi
    - P
    - Publish R
  category_mismatch:
    normal_only:
      '0': 125
      '10': 14
      '14': 19
      '15': 56
      '9': 26
    attack_only: {}
  value_map:
    Connect Command: '1'
    Connect Ack: '2'
    Publish Message: '3'
    Publish Ack: '4'
    Publish Received: '5'
    Publish Release: '6'
    Publish Complete: '7'
    Subscribe Request: '8'
    Subscribe Ack: '9'
    Unsubscribe Request: '10'
    Unsubscribe Ack: '11'
    Ping Request: '12'
    Ping Response: '13'
    Disconnect Req: '14'
  format_note: Normal uses numeric codes, Attack uses text; parser maps text to code.
qos_level_1:
  action: categorical
  reason: qos level 1
  multi: true
  multi_artifact: 'multi-value cells: Normal 0.0000% vs Attack 0.9012%. The Normal
    export keeps the first occurrence only, so counts/sums over multi-value cells
    are not comparable.'
  multi_policy: first_only
  value_map:
    At most once delivery (Fire and Forget): '0'
    At least once delivery (Acknowledged deliver): '1'
    Exactly once delivery (Assured Delivery): '2'
    Reserved: '3'
  format_note: Normal uses numeric codes, Attack uses text; parser maps text to code.
qos_level_2:
