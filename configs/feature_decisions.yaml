  multi: false
  time_ratios:
    p25: 26.14
    p50: 1.19
    p75: 10.14
    p99: 9883.29
  suspect: false
  suspect_reasons_resolved:
  - Normal vs Attack on TCP-only packets differ x9883.3 at p99 (Normal 9989.31, Attack
    1.01073).
  diagnostic: true
  g1_decision: Excluded from the core feature set; Phase 4 exports it as a diagnostic
    column so Phase 5 C3 can measure it. Final call at G2.
