# Label mapping: directory names → scenario codes and attack types
# Scenario directories → 5-letter codes
scenarios:
  "Basic Connect Flooding": BCF
  "Connect Flooding with WILL payload": WILL
  "Delayed Connect Flooding": DELAYED
  "Invalid Subscription Flooding": INVALID
  "SYN TCP Flooding": SYN

# Attack type subdirectories
attack_types: ["DoS", "DDoS"]

# Normal data
normal:
  scenario: NORMAL
  attack_type: NONE
  csv_dir_key: normal_csv_dir   # relative to raw_root

# File prefix → scenario (for cross-checking)
file_prefixes:
  BF1: BCF
  WILL: WILL
  Delay: DELAYED
  Sub: INVALID
  SYN: SYN

# Class mapping (6-class mode)
class6:
  NORMAL: NORMAL
  BCF_DoS: BCF
  BCF_DDoS: BCF
  WILL_DoS: WILL
  WILL_DDoS: WILL
  DELAYED_DoS: DELAYED
  DELAYED_DDoS: DELAYED
  INVALID_DoS: INVALID
  INVALID_DDoS: INVALID
  SYN_DoS: SYN
  SYN_DDoS: SYN

