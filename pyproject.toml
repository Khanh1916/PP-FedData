# Packaging of the study's code. `python -m pip install -e .` makes the package `ppfeddata` (src/ppfeddata) importable, so that
# `python -m ppfeddata.cli <command>` runs from anywhere; edits to the code take effect without reinstalling.
# The libraries are not declared here: requirements.txt gives the version ranges, requirements-lock.txt the exact versions of the run.
# pytest reads its settings from [tool.pytest.ini_options] below (`python -m pytest -q` runs tests/).

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppfeddata"
version = "0.1.0"
description = "Privacy-Preserving Federated Data Generation for IoT IDS"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
